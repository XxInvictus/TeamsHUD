      - name: Run Forge Server Test
        uses: headlesshq/mc-runtime-test@4.1.0
        with:
          java: '17'
          mc: ${{ steps.properties.outputs.minecraft_version }}
          modloader: forge
          regex: '.*forge.*'
          mc-runtime-test: lexforge

  cleanup:
    name: Cleanup Artifacts
    needs: [build, test-fabric-client, test-fabric-server, test-forge-client, test-forge-server]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Delete Build Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            build-artifacts
            gradle-properties
          failOnError: false
