    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Delete Build Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            build-artifacts
            gradle-properties
          failOnError: false
