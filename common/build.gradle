plugins {
    id 'idea'
    id 'java'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom'
}
base {
    archivesName = "${mod_name}-common-${minecraft_version}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.7'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

loom {
    if (project.file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project.file("src/main/resources/${mod_id}.accesswidener"))
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
