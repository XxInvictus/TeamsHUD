import org.gradle.api.file.DuplicatesStrategy
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle'
    id 'org.spongepowered.mixin'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}
base {
    archivesName = "${mod_name}-forge-${minecraft_version}-${mod_version}"
}
mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

minecraft {
    mappings channel: 'parchment', version: "${parch_mapping}-${minecraft_version}"

    copyIdeResources = true //Calls processResources when in dev

    // Automatically enable forge AccessTransformers if the file exists
    // This location is hardcoded in Forge and can not be changed.
    // https://github.com/MinecraftForge/MinecraftForge/blob/be1698bb1554f9c8fa2f58e32b9ab70bc4385e60/fmlloader/src/main/java/net/minecraftforge/fml/loading/moddiscovery/ModFile.java#L123
    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        client2 {
            parent runs.client
            args '--username', 'Dev1'
        }

        server {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }

        data {
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            taskName 'Data'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modDataRun {
                    source sourceSets.main
                    source project(":common").sourceSets.main
                }
            }
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly project(":common")
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

tasks.named("compileJava", JavaCompile).configure {
    outputs.file(layout.buildDirectory.file("tmp/compileJava/${mod_id}.refmap.json"))
    outputs.file(layout.buildDirectory.file("tmp/compileJava/compileJava-refmap.json"))
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

tasks.named("jar", Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

afterEvaluate {
    def reobfTask = tasks.named("reobfJar")
    def jarTask = tasks.named("jar")

    // This is an oddity of the multi-loader build in Github Actions.
    // Without this, the Forge jar does not get the reobf applied before being published.
    def syncReobfReleaseJar = tasks.register("syncReobfReleaseJar") {
        group = "build"
        description = "Ensures the Forge release jar matches the latest reobfuscated output"
        dependsOn(reobfTask)
        inputs.file(layout.buildDirectory.file("reobfJar/output.jar"))
        outputs.file(jarTask.flatMap { it.archiveFile })
        doLast {
            def reobfOutput = layout.buildDirectory.file("reobfJar/output.jar").get().asFile
            def releaseJar = jarTask.flatMap { it.archiveFile }.get().asFile
            if (!reobfOutput.exists()) {
                throw new GradleException("Reobf output not found at ${reobfOutput}")
            }
            Files.createDirectories(releaseJar.parentFile.toPath())
            Files.copy(reobfOutput.toPath(), releaseJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        }
    }

    reobfTask.configure {
        outputs.upToDateWhen { false }
        outputs.cacheIf { false }
    }

    jarTask.configure {
        finalizedBy(syncReobfReleaseJar)
    }

    tasks.named("build") {
        dependsOn(syncReobfReleaseJar)
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            fg.component(it)
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
